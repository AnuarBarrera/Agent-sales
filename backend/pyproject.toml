[project]
name = "tuwebmx-crm-backend"
version = "0.1.0"
description = "Tu Web MX CRM Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.34",
    "alembic==1.13.2",
    "psycopg[binary]==3.2.1",
    "redis==5.2.0",
    "rq==1.16.2",
    "argon2-cffi==23.1.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "geoalchemy2==0.15.2",
    "pgvector==0.2.5",
    "tenacity==8.5.0",
    "structlog==24.4.0",
    "email-validator==2.3.0",
    "boto3==1.35.0",
    "botocore==1.35.0",
    "requests==2.32.0",
]

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "migrations*"]
